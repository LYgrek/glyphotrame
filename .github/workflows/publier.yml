# Publier une version de Glyphotrame (docs/notes.md, « Publier une version »).
# Déclenché par un tag vX.Y.Z (créé par « npm run release -- patch|minor|major ») :
# construit l'application sur Windows, signe les mises à jour et publie la release
# (installateur NSIS + signature + latest.json + notes de version) dans le dépôt PUBLIC
# LYgrek/glyphotrame-releases, où l'updater de l'application va chercher latest.json.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   TAURI_SIGNING_PRIVATE_KEY           contenu de %USERPROFILE%\.tauri\glyphotrame.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  son mot de passe
#   RELEASES_TOKEN                      jeton fine-grained limité à glyphotrame-releases (Contents : Read and write)

name: Publier une version

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# une seule publication à la fois
concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # secrets présents et jeton capable d'écrire dans glyphotrame-releases, avant 20 min de construction
      - name: Secrets
        shell: bash
        env:
          CLE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MDP: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JETON: ${{ secrets.RELEASES_TOKEN }}
        run: |
          manque=""
          [ -n "$CLE" ] || manque="$manque TAURI_SIGNING_PRIVATE_KEY"
          [ -n "$MDP" ] || manque="$manque TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          [ -n "$JETON" ] || manque="$manque RELEASES_TOKEN"
          if [ -n "$manque" ]; then echo "::error::Secrets manquants dans le dépôt glyphotrame :$manque"; exit 1; fi
          droits=$(curl -s -H "Authorization: Bearer $JETON" https://api.github.com/repos/LYgrek/glyphotrame-releases | jq -r '.permissions.push // "absent"')
          if [ "$droits" != "true" ]; then echo "::error::RELEASES_TOKEN ne peut pas écrire dans LYgrek/glyphotrame-releases (expiré, mauvais dépôt ou permission Contents manquante)."; exit 1; fi
          echo "Secrets présents, jeton valide pour glyphotrame-releases."

      # le tag doit correspondre à la version des fichiers ; notes lues dans docs/versions.md
      - name: Version et notes
        id: notes
        run: node tools/release-notes.mjs ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: ffmpeg et ffprobe (sidecars)
        shell: pwsh
        run: ./tools/get-ffmpeg.ps1
        env:
          # évite la limite de requêtes anonymes de l'API GitHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire, signer et publier
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: LYgrek
          repo: glyphotrame-releases
          tagName: ${{ github.ref_name }}
          # le tag est créé dans glyphotrame-releases, sur sa branche main (le commit du code n'y existe pas)
          releaseCommitish: main
          releaseName: Glyphotrame ${{ steps.notes.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

